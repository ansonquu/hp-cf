<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <link href="/assets/fonts/inter.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            z-index: 1;
        }

        .error-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-number {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            gap: 0.5rem;
        }

        .digit {
            font-size: 8rem;
            font-weight: 700;
            color: #667eea;
            text-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
            animation: bounce 2s infinite;
        }

        .digit:nth-child(3) {
            animation-delay: 0.2s;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .zero {
            position: relative;
            width: 8rem;
            height: 8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle {
            width: 100%;
            height: 100%;
            border: 8px solid #667eea;
            border-radius: 50%;
            animation: rotate 3s linear infinite;
            position: relative;
        }

        .circle::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            transform: translateX(-50%);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translateX(-50%) scale(1.2);
                opacity: 0.7;
            }
        }

        .error-title {
            font-size: 2.5rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 1rem;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .error-description {
            font-size: 1.1rem;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-out 0.7s both;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            min-width: 140px;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }



        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-element {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            animation-delay: var(--delay);
        }

        .floating-element:nth-child(1) {
            top: 10%;
            left: 10%;
        }

        .floating-element:nth-child(2) {
            top: 20%;
            right: 15%;
        }

        .floating-element:nth-child(3) {
            bottom: 30%;
            left: 5%;
        }

        .floating-element:nth-child(4) {
            bottom: 20%;
            right: 10%;
        }

        .floating-element:nth-child(5) {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.7;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 1;
            }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .error-content {
                padding: 2rem 1.5rem;
            }
            
            .digit {
                font-size: 6rem;
            }
            
            .zero {
                width: 6rem;
                height: 6rem;
            }
            
            .error-title {
                font-size: 2rem;
            }
            
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 250px;
            }
            

        }

        @media (max-width: 480px) {
            .digit {
                font-size: 4rem;
            }
            
            .zero {
                width: 4rem;
                height: 4rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .error-description {
                font-size: 1rem;
            }
        }
    </style>
<link rel="stylesheet" href="/assets/dark.css">
</head>
<body>
    <div class="container">
        <div class="error-content">
            <div class="error-number">
                <span class="digit">4</span>
                <div class="zero">
                    <div class="circle"></div>
                </div>
                <span class="digit">4</span>
            </div>
            
            <h1 class="error-title">页面未找到</h1>
            <p class="error-description">
                抱歉，您访问的页面不存在或已被移动。<br>
                请检查URL是否正确，或返回首页。
            </p>
            
            <div class="error-actions">
                <button class="btn btn-primary" onclick="goBack()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    返回上页
                </button>
                <button class="btn btn-secondary" onclick="goHome()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9,22 9,12 15,12 15,22"/>
                    </svg>
                    返回首页
                </button>
            </div>
            

        </div>
        
        <div class="floating-elements">
            <div class="floating-element" style="--delay: 0s"></div>
            <div class="floating-element" style="--delay: 2s"></div>
            <div class="floating-element" style="--delay: 4s"></div>
            <div class="floating-element" style="--delay: 6s"></div>
            <div class="floating-element" style="--delay: 8s"></div>
        </div>
    </div>
    
    <script>
        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 添加页面加载动画
            addPageLoadAnimation();
            
            // 添加键盘事件监听
            addKeyboardEvents();
            

            
            // 添加鼠标移动视差效果
            addParallaxEffect();
        });

        // 页面加载动画
        function addPageLoadAnimation() {
            const elements = document.querySelectorAll('.error-content > *');
            elements.forEach((element, index) => {
                element.style.opacity = '0';
                element.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    element.style.transition = 'all 0.6s ease-out';
                    element.style.opacity = '1';
                    element.style.transform = 'translateY(0)';
                }, index * 200);
            });
        }

        // 返回上一页
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                goHome();
            }
        }

        // 返回首页
        function goHome() {
            // 这里可以修改为您的网站首页URL
            window.location.href = '/';
        }



        // 键盘事件
        function addKeyboardEvents() {
            document.addEventListener('keydown', function(event) {
                // ESC键返回上一页
                if (event.key === 'Escape') {
                    goBack();
                }
                

                
                // 数字键1返回上一页，数字键2返回首页
                if (event.key === '1') {
                    goBack();
                } else if (event.key === '2') {
                    goHome();
                }
            });
        }



        // 鼠标移动视差效果
        function addParallaxEffect() {
            const floatingElements = document.querySelectorAll('.floating-element');
            
            document.addEventListener('mousemove', function(event) {
                const mouseX = event.clientX / window.innerWidth;
                const mouseY = event.clientY / window.innerHeight;
                
                floatingElements.forEach((element, index) => {
                    const speed = (index + 1) * 0.5;
                    const x = (mouseX - 0.5) * speed * 20;
                    const y = (mouseY - 0.5) * speed * 20;
                    
                    element.style.transform = `translate(${x}px, ${y}px)`;
                });
            });
        }

        // 添加按钮点击波纹效果
        document.addEventListener('click', function(event) {
            if (event.target.classList.contains('btn')) {
                createRipple(event);
            }
        });

        // 创建波纹效果
        function createRipple(event) {
            const button = event.currentTarget;
            const ripple = document.createElement('span');
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('ripple');
            
            button.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // 添加页面可见性变化事件
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                // 页面重新可见时，重新启动动画
                const circle = document.querySelector('.circle');
                if (circle) {
                    circle.style.animation = 'none';
                    setTimeout(() => {
                        circle.style.animation = 'rotate 3s linear infinite';
                    }, 10);
                }
            }
        });

        // 添加窗口大小变化事件
        window.addEventListener('resize', function() {
            // 重新计算浮动元素位置
            const floatingElements = document.querySelectorAll('.floating-element');
            floatingElements.forEach((element, index) => {
                element.style.animationDelay = `${index * 2}s`;
            });
        });

        // 添加页面卸载事件
        window.addEventListener('beforeunload', function() {
            // 可以在这里添加页面离开时的清理工作
            console.log('页面即将离开');
        });

        // 添加错误处理
        window.addEventListener('error', function(event) {
            console.error('页面发生错误:', event.error);
        });

        // 添加未处理的Promise拒绝事件
        window.addEventListener('unhandledrejection', function(event) {
            console.error('未处理的Promise拒绝:', event.reason);
        });
    </script>
</body>
</html>
