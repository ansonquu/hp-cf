<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 引入 MiSans-Bold 字体 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/zhangyiming748/MiSans@latest/MiSans-Bold/stylesheet.css">
    <style>
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Times New Roman', TimesNewRoman, Times, serif !important;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            height: 100%;
            overflow-x: hidden;
            background: #f7f9fa;
        }
        .misans-name {
            font-family: 'MiSans-Bold', 'MiSans', 'SimSun', '宋体', serif !important;
            font-weight: bold;
            letter-spacing: 1.2px;
        }
        .lang-switch {
            position: absolute;
            top: 32px;
            right: 48px;
            z-index: 10;
        }
        .lang-switch a {
            display: inline-block;
            padding: 7px 18px;
            background: linear-gradient(90deg, #0078ff 60%, #00c6ff 100%);
            color: #fff;
            border-radius: 18px;
            font-size: 1em;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,120,255,0.10);
        }
        .lang-switch a:hover {
            background: linear-gradient(90deg, #005fcc 60%, #00aaff 100%);
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(8px) saturate(1.2);
            z-index: 1;
        }
        .center-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .container {
            max-width: 480px;
            background: rgba(255,255,255,0.92);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.14), 0 1.5px 8px rgba(0,120,255,0.08);
            padding: 56px 38px 38px 38px;
            text-align: center;
            position: relative;
            z-index: 3;
            backdrop-filter: blur(2px) saturate(1.1);
            animation: fadeIn 1.2s cubic-bezier(.4,0,.2,1);
            display: inline-block;
            min-width: 320px;
            max-width: 100vw;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: none; }
        }
        
        @keyframes slideInUp {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        .avatar-outer {
            background: linear-gradient(135deg, #6dd5ed 0%, #2193b0 100%);
            padding: 4px;
            border-radius: 50%;
            display: inline-block;
            margin-bottom: 24px;
            box-shadow: 0 2px 16px rgba(33,147,176,0.13);
            transition: box-shadow 0.3s, transform 0.3s;
            animation: slideInUp 0.8s ease-out 0.2s both;
        }
        .avatar-outer:hover {
            box-shadow: 0 6px 32px rgba(33,147,176,0.22);
            transform: scale(1.06) rotate(-2deg);
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #e3e3e3;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
            border: 4px solid #fff;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 2.4em;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: #1a2a3a;
            text-shadow: 0 1px 0 #fff, 0 2px 8px rgba(0,120,255,0.04);
            animation: slideInUp 0.8s ease-out 0.4s both;
        }
        h2 {
            margin: 0 0 22px 0;
            font-size: 1.18em;
            font-weight: 400;
            color: #4a6fa1;
            letter-spacing: 0.04em;
            animation: slideInUp 0.8s ease-out 0.5s both;
        }
        .subtle-link {
            text-decoration: none;
            color: inherit;
            transition: opacity 0.2s ease;
        }
        .subtle-link:hover {
            opacity: 0.7;
        }
        p {
            color: #444;
            font-size: 1.09em;
            margin-bottom: 38px;
            line-height: 1.8;
            text-shadow: 0 1px 0 #fff;
            animation: slideInUp 0.8s ease-out 0.6s both;
        }
        .social-row {
            display: flex;
            justify-content: flex-start;
            gap: 22px;
            margin-bottom: 36px;
            width: 100%;
            overflow-x: auto;
            padding: 0 8px;
            box-sizing: border-box;
            flex-wrap: nowrap;
            scrollbar-width: none;
            animation: slideInUp 0.8s ease-out 0.7s both;
        }
        .social-row::-webkit-scrollbar {
            display: none;
        }
        .social-row a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0e7ef 60%, #f4f8ff 100%);
            box-shadow: 0 2px 8px rgba(0,120,255,0.08);
            color: #0078ff;
            font-size: 1.5em;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.15s;
            text-decoration: none;
        }
        .social-row a:hover {
            background: linear-gradient(135deg, #0078ff 60%, #00c6ff 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0,120,255,0.18);
            transform: scale(1.12);
        }
        .social-row a:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }
        .wechat-hover {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .wechat-qrcode {
            display: none;
            position: absolute;
            left: 50%;
            top: 110%;
            transform: translateX(-50%);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.13);
            padding: 4px;
            z-index: 10;
            min-width: 0;
            min-height: 0;
            text-align: center;
            animation: fadeIn .25s;
            /* 不设置max-width/max-height */
        }
        .wechat-qrcode img {
            display: block;
            width: auto;
            height: auto;
            max-width: 500px;
            max-height: 500px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #f4f4f4;
        }
        .wechat-tip {
            display: block;
            color: #4a6fa1;
            font-size: 0.98em;
            margin-top: 2px;
        }
        .contact-btn {
            display: inline-block;
            padding: 15px 48px;
            background: linear-gradient(90deg, #0078ff 60%, #00c6ff 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1.18em;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0,120,255,0.13);
            letter-spacing: 0.04em;
            outline: none;
            position: relative;
            animation: slideInUp 0.8s ease-out 0.8s both;
        }
        .contact-btn:active {
            background: linear-gradient(90deg, #005fcc 60%, #00aaff 100%);
            box-shadow: 0 1px 4px rgba(0,120,255,0.10);
            transform: scale(0.97);
        }
        .contact-btn:hover {
            background: linear-gradient(90deg, #005fcc 60%, #00aaff 100%);
            box-shadow: 0 4px 18px rgba(0,120,255,0.18);
        }
        .footer-box {
            margin: 36px auto 18px auto;
            background: rgba(255,255,255,0.92);
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,120,255,0.10), 0 1.5px 8px rgba(0,120,255,0.04);
            padding: 16px 32px;
            color: #7a8fa6;
            font-size: 1em;
            letter-spacing: 0.04em;
            text-align: center;
            opacity: 0.92;
            user-select: none;
            text-shadow: 0 1px 0 #fff;
            max-width: 340px;
            animation: slideInUp 0.8s ease-out 0.9s both;
        }
        @media (max-width: 600px) {
            html, body {
                font-size: 14px;
            }
            .container {
                padding: 24px 16px 20px 16px;
                max-width: 92vw;
                border-radius: 20px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.12);
                margin: 0 4vw;
            }
            .avatar-outer {
                margin-bottom: 20px;
            }
            .avatar, .avatar-outer {
                width: 80px;
                height: 80px;
                min-width: 80px;
                min-height: 80px;
            }
            .avatar img {
                width: 100%;
                height: 100%;
            }
            h1 {
                font-size: 1.8em;
                margin-bottom: 10px;
                letter-spacing: 0.8px;
            }
            h2 {
                font-size: 1.1em;
                margin-bottom: 16px;
                letter-spacing: 0.02em;
            }
            p {
                font-size: 1.02em;
                margin-bottom: 28px;
                line-height: 1.7;
            }
            .social-row {
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
                margin-bottom: 28px;
                padding: 0 4px;
            }
            .social-row a {
                width: 40px;
                height: 40px;
                font-size: 1.2em;
                border-radius: 50%;
            }
            .wechat-qrcode {
                left: 50%;
                top: 130%;
                min-width: 120px;
                max-width: 85vw;
                padding: 8px 8px 4px 8px;
                border-radius: 16px;
            }
            .wechat-qrcode img {
                max-width: 75vw;
                max-height: 45vw;
                border-radius: 12px;
            }
            .contact-btn {
                padding: 14px 0;
                width: 85vw;
                max-width: 280px;
                font-size: 1.1em;
                border-radius: 25px;
                letter-spacing: 0.06em;
                font-weight: 700;
            }
            .footer-box {
                padding: 12px 16px;
                font-size: 0.94em;
                max-width: 92vw;
                margin: 24px auto 12px auto;
                border-radius: 14px;
                line-height: 1.6;
            }
            .lang-switch {
                top: 16px;
                right: 16px;
            }
            .lang-switch a {
                padding: 6px 14px;
                font-size: 0.9em;
                border-radius: 16px;
            }
            #page-bg {
                width: 100vw !important;
                height: 100vh !important;
                object-fit: cover !important;
            }
            .overlay {
                backdrop-filter: blur(6px) saturate(1.1);
            }
            .center-wrapper {
                padding: 0 4vw;
            }
        }
        
        /* 超小屏幕优化 */
        @media (max-width: 400px) {
            html, body {
                font-size: 13px;
            }
            .container {
                padding: 20px 12px 16px 12px;
                max-width: 94vw;
                margin: 0 3vw;
            }
            .avatar, .avatar-outer {
                width: 72px;
                height: 72px;
                min-width: 72px;
                min-height: 72px;
            }
            h1 {
                font-size: 1.6em;
            }
            h2 {
                font-size: 1em;
            }
            .social-row {
                gap: 14px;
            }
            .social-row a {
                width: 36px;
                height: 36px;
                font-size: 1.1em;
            }
            .contact-btn {
                width: 88vw;
                max-width: 260px;
                font-size: 1em;
                padding: 12px 0;
            }
            .footer-box {
                padding: 10px 12px;
                font-size: 0.9em;
            }
        }
        .wechat-hover:hover .wechat-qrcode {
            display: block;
        }
        
        /* 手机版触摸优化 */
        @media (max-width: 600px) {
            .social-row a {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }
            
            .contact-btn {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }
            
            .lang-switch a {
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }
            
            /* 优化滚动性能 */
            .social-row {
                -webkit-overflow-scrolling: touch;
                scroll-behavior: smooth;
            }
            
            /* 减少动画在低端设备上的性能消耗 */
            .avatar-outer,
            h1, h2, p, .social-row, .contact-btn, .footer-box {
                will-change: transform;
            }
        }
    </style>
