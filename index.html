    <style>
        /* ============ Material Design 3 色调系统（种子色 #0078ff） ============ */
        :root {
            --md-primary: #0078ff;
            --md-on-primary: #ffffff;
            --md-primary-container: #d8e3ff;
            --md-on-primary-container: #001b3f;
            --md-secondary: #535f70;
            --md-on-secondary: #ffffff;
            --md-secondary-container: #d7e3f8;
            --md-on-secondary-container: #101c2b;
            --md-tertiary: #6b5778;
            --md-on-tertiary: #ffffff;
            --md-tertiary-container: #f2daff;
            --md-on-tertiary-container: #251431;

            --md-surface: #f9f9ff;
            --md-on-surface: #1a1c1e;
            --md-surface-variant: #e0e2ec;
            --md-on-surface-variant: #44474e;
            --md-surface-container-lowest: #ffffff;
            --md-surface-container-low: #f3f3f7;
            --md-surface-container: #ededf1;
            --md-surface-container-high: #e8e8ec;
            --md-surface-container-highest: #e2e2e6;
            --md-outline: #74777f;
            --md-outline-variant: #c4c6d0;

            --md-shadow-1: 0 1px 2px rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.15);
            --md-shadow-2: 0 1px 2px rgba(0,0,0,0.30), 0 2px 6px 2px rgba(0,0,0,0.15);
            --md-shadow-3: 0 1px 3px rgba(0,0,0,0.30), 0 4px 8px 3px rgba(0,0,0,0.15);

            --md-radius-md: 12px;
            --md-radius-lg: 16px;
            --md-radius-xl: 28px;
            --md-radius-full: 999px;

            --md-ease: cubic-bezier(0.2, 0, 0, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --md-primary: #aac7ff;
                --md-on-primary: #002e6b;
                --md-primary-container: #004494;
                --md-on-primary-container: #d8e3ff;
                --md-secondary: #bbc7db;
                --md-on-secondary: #253140;
                --md-secondary-container: #3b4857;
                --md-on-secondary-container: #d7e3f8;
                --md-tertiary: #d6bde4;
                --md-on-tertiary: #3b2948;
                --md-tertiary-container: #533f60;
                --md-on-tertiary-container: #f2daff;

                --md-surface: #1a1c1e;
                --md-on-surface: #e2e2e6;
                --md-surface-variant: #44474e;
                --md-on-surface-variant: #c4c6d0;
                --md-surface-container-lowest: #0f1113;
                --md-surface-container-low: #1a1c1e;
                --md-surface-container: #1e2022;
                --md-surface-container-high: #282a2d;
                --md-surface-container-highest: #333538;
                --md-outline: #8e9199;
                --md-outline-variant: #44474e;

                --md-shadow-1: 0 1px 2px rgba(0,0,0,0.50), 0 1px 3px 1px rgba(0,0,0,0.35);
                --md-shadow-2: 0 1px 2px rgba(0,0,0,0.50), 0 2px 6px 2px rgba(0,0,0,0.35);
                --md-shadow-3: 0 1px 3px rgba(0,0,0,0.50), 0 4px 8px 3px rgba(0,0,0,0.35);
            }
        }

        /* ============ 基础 ============ */
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--md-surface);
            color: var(--md-on-surface);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }
        img { display: block; max-width: 100%; }

        /* 背景图 */
        #page-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            user-select: none;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(249, 249, 255, 0.82);
            backdrop-filter: blur(10px) saturate(1.2);
            z-index: 1;
        }
        @media (prefers-color-scheme: dark) {
            .overlay { background: rgba(15, 17, 19, 0.80); }
        }

        /* 语言切换 */
        .lang-switch {
            position: absolute;
            top: 24px;
            right: 32px;
            z-index: 10;
        }
        .lang-switch a {
            display: inline-flex;
            align-items: center;
            height: 40px;
            padding: 0 18px;
            border-radius: var(--md-radius-full);
            background: var(--md-primary);
            color: var(--md-on-primary);
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--md-shadow-1);
            transition: box-shadow 0.2s var(--md-ease), background 0.2s var(--md-ease);
        }
        .lang-switch a:hover {
            box-shadow: var(--md-shadow-2);
            background: color-mix(in srgb, var(--md-primary) 90%, var(--md-on-primary));
        }

        /* 中央布局 */
        .center-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            padding: 48px 16px;
        }
        .container {
            width: min(480px, 100%);
            background: color-mix(in srgb, var(--md-surface-container-lowest) 90%, transparent);
            border-radius: var(--md-radius-xl);
            box-shadow: var(--md-shadow-3);
            padding: 48px 38px 36px;
            text-align: center;
        }

        /* 头像 */
        .avatar-outer {
            background: linear-gradient(135deg, var(--md-primary) 0%, #00c6ff 100%);
            padding: 4px;
            border-radius: 50%;
            display: inline-block;
            margin-bottom: 24px;
            box-shadow: var(--md-shadow-2);
            transition: transform 0.3s var(--md-ease), box-shadow 0.3s var(--md-ease);
        }
        .avatar-outer:hover {
            box-shadow: var(--md-shadow-3);
            transform: scale(1.05);
        }
        .avatar {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--md-surface-container-lowest);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        h1 {
            margin: 0;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--md-on-surface);
        }
        h2 {
            margin: 4px 0;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--md-on-surface-variant);
        }
        h2 a.subtle-link { color: var(--md-primary); font-weight: 600; }
        .motto {
            margin: 16px 0 0;
            font-size: 1rem;
            color: var(--md-on-surface-variant);
            line-height: 1.7;
        }
        .motto + .motto { margin-top: 2px; }

        /* 社交图标（一体化 MD3 圆钮） */
        .social-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 28px 0;
        }
        .social-btn {
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--md-surface-container-high);
            color: var(--md-on-surface-variant);
            font-size: 1.2rem;
            transition: background 0.2s var(--md-ease), color 0.2s var(--md-ease), transform 0.15s var(--md-ease), box-shadow 0.2s var(--md-ease);
        }
        .social-btn:hover {
            background: var(--md-primary);
            color: var(--md-on-primary);
            transform: translateY(-3px);
            box-shadow: var(--md-shadow-2);
        }
        .wechat-hover { position: relative; display: inline-flex; }
        .wechat-qrcode {
            position: absolute;
            left: 50%;
            top: calc(100% + 12px);
            transform: translateX(-50%) translateY(4px);
            background: var(--md-surface-container-highest);
            border-radius: var(--md-radius-lg);
            box-shadow: var(--md-shadow-3);
            padding: 8px;
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s var(--md-ease), transform 0.2s var(--md-ease), visibility 0.2s var(--md-ease);
        }
        .wechat-qrcode img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: var(--md-radius-md);
            background: #fff;
            display: block;
        }
        .wechat-hover:hover .wechat-qrcode {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* 按钮 */
        .contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 52px;
            padding: 0 48px;
            border-radius: var(--md-radius-full);
            background: var(--md-primary);
            color: var(--md-on-primary);
            font-size: 1.05rem;
            font-weight: 600;
            box-shadow: var(--md-shadow-1);
            transition: box-shadow 0.2s var(--md-ease), background 0.2s var(--md-ease);
        }
        .contact-btn:hover {
            box-shadow: var(--md-shadow-2);
            background: color-mix(in srgb, var(--md-primary) 90%, var(--md-on-primary));
        }

        /* 备案脚注 */
        .footer-box {
            margin: 24px auto 0;
            width: min(480px, 100%);
            background: color-mix(in srgb, var(--md-surface-container-lowest) 90%, transparent);
            border-radius: var(--md-radius-lg);
            box-shadow: var(--md-shadow-1);
            padding: 14px 20px;
            color: var(--md-on-surface-variant);
            font-size: 0.85rem;
            text-align: center;
            line-height: 2.1;
        }
        .footer-box a {
            color: var(--md-primary);
            display: inline-flex;
            align-items: center;
        }
        .footer-box a img {
            height: 1em;
            width: auto;
            margin-right: 5px;
            vertical-align: middle;
            display: inline-block;
        }
        .footer-box img.cert { height: 50px; }

        /* 响应式 */
        @media (max-width: 600px) {
            .container { padding: 36px 22px 28px; }
            .avatar, .avatar-outer { width: 92px; height: 92px; }
            .avatar img { width: 100%; height: 100%; }
            h1 { font-size: 2rem; }
            .social-btn { width: 42px; height: 42px; font-size: 1.1rem; }
            .contact-btn { width: 100%; padding: 0 24px; }
            .lang-switch { top: 16px; right: 16px; }
        }
    </style>
</head>
